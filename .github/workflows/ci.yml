name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — build & testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_dev_password
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Consumido pelo CustomWebApplicationFactory dos testes de integração.
      CRM_TEST_DB_HOST: localhost
      CRM_TEST_DB_PORT: 5432
      CRM_TEST_DB_USER: crm
      CRM_TEST_DB_PASSWORD: crm_dev_password

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Crm.sln

      - name: Build
        run: dotnet build Crm.sln -c Release --no-restore

      - name: Test
        run: dotnet test Crm.sln -c Release --no-build --verbosity normal

  frontend:
    name: Frontend — build & lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
